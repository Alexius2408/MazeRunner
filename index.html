<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style\main.css" />
    <link rel="stylesheet" href="style/audio.css" />
  </head>
  <body>
    <div class="rotate_screen">
      <h1>Please rotate your device</h1>
      <img src=".\assets\pngfind.com-smartphone-icon-png-2340150.png" />
    </div>
    <div class="main_menu">
      <div class="task_bar">
        <img src="./assets/Caracter.png" />
        <h1>Welcome to maze runner</h1>
        <img src="./assets/Caracter.png" />
      </div>
      <div class="main-container">
        <div data-audio-widget></div>
      </div>

      <div class="size_selector">
        <label for="size_range"
          >Maze Size: <span id="size_value">15 x 15</span></label
        >
        <input
          type="range"
          id="size_range"
          min="5"
          max="19"
          step="2"
          value="15"
        />
      </div>

      <div class="start_button">
        <button id="start_button">Start</button>
      </div>

      <footer>
        <button id="credits_button">Credits</button>
        <button id="impressum_button">Impressum</button>
      </footer>
    </div>

    <script src="./script/audio.js"></script>
    <script src="./script/main.js"></script>
  </body>
</html>
